<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Jornada Laboral</title>
</head>
<body>
    <h2>Registrar Jornada Laboral</h2>
    <form action="procesar.php" method="POST">
        <label for="nombre">Nombre del empleado:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="fecha">Fecha:</label><br>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label for="entrada">Hora de entrada:</label><br>
        <input type="time" id="entrada" name="entrada" required><br><br>

        <label for="salida">Hora de salida:</label><br>
        <input type="time" id="salida" name="salida" required><br><br>

        <input type="submit" value="Guardar">
    </form>
</body>

</html>
